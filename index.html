<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f7"><link rel="manifest" href="manifest.webmanifest"><title>家務管家</title><style>
body{font-family:-apple-system,sans-serif;background:#f4f4f6;margin:0;color:#171717}header{background:#fff;padding:20px 16px;position:sticky;top:0}main{padding:14px 14px 90px}.card,.box{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card b{display:block;font-size:28px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #ddd}nav button{border:0;background:#fff;padding:14px 2px}section{display:none}section.on{display:block}.top{display:flex;justify-content:space-between;align-items:center}.add{background:#111;color:#fff;border:0;border-radius:12px;padding:10px 13px}.item{border-bottom:1px solid #eee;padding:12px 0}.item:last-child{border:0}.meta{font-size:13px;color:#666;margin:5px 0}.soft{border:0;border-radius:9px;padding:8px;background:#eee}dialog{border:0;border-radius:18px;width:85%;max-width:480px}input{box-sizing:border-box;width:100%;padding:11px;margin:4px 0 10px;border:1px solid #ccc;border-radius:10px;font-size:16px}label{font-size:13px;color:#555}
</style></head><body><header><b style="font-size:25px">家務管家</b><div style="color:#666;font-size:13px">家事・耗材・採購・物品資料</div></header><main>
<section id="home" class="on"><div class="grid"><div class="card">到期家事<b id="hc">0</b></div><div class="card">待換耗材<b id="hs">0</b></div><div class="card">待購買<b id="hb">0</b></div><div class="card">物品資料<b id="hi">0</b></div></div><h3>近期提醒</h3><div class="box" id="rem"></div></section>
<section id="chores"><div class="top"><h2>家事</h2><button class="add" onclick="openF('c')">＋新增</button></div><div class="box" id="cl"></div></section>
<section id="supplies"><div class="top"><h2>耗材更換</h2><button class="add" onclick="openF('s')">＋新增</button></div><div class="box" id="sl"></div></section>
<section id="shopping"><div class="top"><h2>採購</h2><button class="add" onclick="openF('b')">＋新增</button></div><div class="box" id="bl"></div></section>
<section id="items"><div class="top"><h2>物品資料</h2><button class="add" onclick="openF('i')">＋新增</button></div><div class="box" id="il"></div></section>
</main><nav><button data-x="home">首頁</button><button data-x="chores">家事</button><button data-x="supplies">耗材</button><button data-x="shopping">採購</button><button data-x="items">物品</button></nav>
<dialog id="dlg"><h3 id="ft"></h3><div id="fields"></div><button class="soft" onclick="dlg.close()">取消</button> <button class="add" onclick="save()">儲存</button></dialog>
<script>
const K='hm02',T=()=>new Date().toISOString().slice(0,10),A=(d,n)=>{let x=new Date(d+'T12:00');x.setDate(x.getDate()+(+n));return x.toISOString().slice(0,10)},ID=()=>Date.now().toString()+Math.random();
let d=JSON.parse(localStorage.getItem(K)||'null')||{c:[],s:[],b:[],i:[]}; let typ='';
const e=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));document.getElementById(b.dataset.x).classList.add('on')});
function p(){localStorage.setItem(K,JSON.stringify(d));r()} function del(t,id){if(confirm('確定刪除？')){d[t]=d[t].filter(x=>x.id!==id);p()}}
function done(t,id){let x=d[t].find(v=>v.id===id);x.last=T();x.next=A(T(),x.cycle);p()} function bought(id){let x=d.b.find(v=>v.id===id);x.done=!x.done;p()}
function r(){let dc=d.c.filter(x=>x.next<=T()),ds=d.s.filter(x=>x.next<=T()),db=d.b.filter(x=>!x.done);hc.textContent=dc.length;hs.textContent=ds.length;hb.textContent=db.length;hi.textContent=d.i.length;
rem.innerHTML=[...dc.map(x=>'家事：'+e(x.name)+'（'+x.next+'）'),...ds.map(x=>'耗材：'+e(x.name)+'（'+x.next+'）'),...db.map(x=>'採購：'+e(x.name))].map(x=>'<div class=item>'+x+'</div>').join('')||'目前沒有提醒';
cl.innerHTML=d.c.map(x=>`<div class=item><b>${e(x.name)}</b><div class=meta>每 ${x.cycle} 天・下次 ${x.next}</div><button class=soft onclick="done('c','${x.id}')">✓ 已完成</button> <button class=soft onclick="del('c','${x.id}')">刪除</button></div>`).join('')||'尚無資料';
sl.innerHTML=d.s.map(x=>`<div class=item><b>${e(x.name)}</b><div class=meta>型號 ${e(x.model)}・上次 ${x.last}<br>週期 ${x.cycle} 天・下次 ${x.next}</div><button class=soft onclick="done('s','${x.id}')">✓ 已更換</button> <button class=soft onclick="del('s','${x.id}')">刪除</button></div>`).join('')||'尚無資料';
bl.innerHTML=d.b.map(x=>`<div class=item><b>${e(x.name)}</b><div class=meta>數量 ${e(x.qty)} ${x.done?'・已購買':''}</div><button class=soft onclick="bought('${x.id}')">${x.done?'恢復':'✓ 已購買'}</button> <button class=soft onclick="del('b','${x.id}')">刪除</button></div>`).join('')||'尚無資料';
il.innerHTML=d.i.map(x=>`<div class=item><b>${e(x.name)}</b><div class=meta>容量 ${x.cap||'-'} ml・每次 ${x.dose||'-'} ml・${x.kg||'-'} kg<br>自動投入 ${x.auto||'-'} ml・約可用 ${x.dose?Math.floor(x.cap/x.dose):'-'} 次</div><button class=soft onclick="del('i','${x.id}')">刪除</button></div>`).join('')||'尚無資料'}
const f=(l,n,t='text',v='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${v}">`;
function openF(t){typ=t;if(t==='c'){ft.textContent='新增家事';fields.innerHTML=f('名稱','name')+f('週期（天）','cycle','number','7')}if(t==='s'){ft.textContent='新增耗材';fields.innerHTML=f('名稱','name')+f('型號','model')+f('上次更換日期','last','date',T())+f('更換週期（天）','cycle','number','180')}if(t==='b'){ft.textContent='新增採購';fields.innerHTML=f('名稱','name')+f('數量','qty','text','1')}if(t==='i'){ft.textContent='新增物品';fields.innerHTML=f('名稱','name')+f('容量 ml','cap','number')+f('每次使用 ml','dose','number')+f('對應衣物 kg','kg','number')+f('自動投入 ml','auto','number')}dlg.showModal()}
function save(){let q={};fields.querySelectorAll('input').forEach(x=>q[x.name]=x.value);let id=ID();if(typ==='c')d.c.push({id,name:q.name,cycle:+q.cycle,last:T(),next:A(T(),q.cycle)});if(typ==='s')d.s.push({id,name:q.name,model:q.model,last:q.last,cycle:+q.cycle,next:A(q.last,q.cycle)});if(typ==='b')d.b.push({id,name:q.name,qty:q.qty,done:false});if(typ==='i')d.i.push({id,name:q.name,cap:+q.cap,dose:+q.dose,kg:+q.kg,auto:+q.auto});dlg.close();p()}r();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
